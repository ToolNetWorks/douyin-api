services:
  - type: web
    name: douyin-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: services/douyin-api
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: DOUYIN_COOKIE
        sync: false
      - key: API_KEY
        sync: false
